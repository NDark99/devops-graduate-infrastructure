groups:
  - name: devops-project
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for more than one minute."

      - alert: HostMemoryUsageHigh
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage is above 90%"
          description: "The Ubuntu VM has reported high memory usage for more than five minutes."
